<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sorpresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;800&display=swap">
<style>
  :root { --bg:#15111f; --card:#211b30; --ink:#f6efe6; --muted:#b9adc9; --gold:#e8b65c; --rose:#e9867d; --ok:#7fd1a8;
    --serif:"Instrument Serif", Georgia, serif; --sans:"Manrope", system-ui, sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-tap-highlight-color:transparent; }
  body { min-height:100dvh; }
  .wrap { max-width:520px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); display:flex; flex-direction:column; gap:18px; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .dots { display:flex; gap:5px; } .dots i { width:7px; height:7px; border-radius:50%; background:#3a3150; } .dots i.on { background:var(--gold); }
  h1 { font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem,12vw,3.6rem); line-height:.95; margin:0; letter-spacing:-.01em; }
  h1 em { color:var(--gold); }
  p { margin:0; line-height:1.5; color:var(--muted); font-size:1.02rem; }
  .stage { position:relative; border-radius:20px; overflow:hidden; background:#000; aspect-ratio:3/4; width:100%; touch-action:none; user-select:none; -webkit-user-select:none; }
  .stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .btn { font:inherit; font-weight:800; font-size:1.05rem; border:0; border-radius:999px; padding:15px 22px; background:var(--gold); color:#2a1c00; cursor:pointer; width:100%; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid #4a3f62; }
  input.answer { font:inherit; font-size:1.2rem; width:100%; padding:14px 16px; border-radius:14px; border:1px solid #4a3f62; background:#1c1729; color:var(--ink); text-align:center; }
  .row { display:flex; gap:10px; }
  .feedback { min-height:1.4em; text-align:center; color:var(--rose); font-weight:600; }
  .reveal { background:var(--card); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:12px; animation:rise .6s cubic-bezier(.2,.8,.2,1) both; border:1px solid rgba(232,182,92,.35); }
  .reveal .lbl { font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:800; }
  .reveal .txt { font-family:var(--serif); font-size:1.9rem; line-height:1.1; color:var(--ink); }
  .reveal img { width:100%; border-radius:14px; display:block; }
  @keyframes rise { from { opacity:0; transform:translateY(16px) scale(.98); } to { opacity:1; transform:none; } }
  /* canción */
  .vinyl { width:72%; aspect-ratio:1; margin:8px auto; border-radius:50%; background:repeating-radial-gradient(circle,#111 0 2px,#1c1c1c 2px 4px); position:relative; box-shadow:0 20px 60px rgba(0,0,0,.6); animation:spin 4s linear infinite; animation-play-state:paused; }
  .vinyl.play { animation-play-state:running; }
  .vinyl::after { content:""; position:absolute; inset:34%; border-radius:50%; background:radial-gradient(circle,#15111f 0 8%,var(--rose) 9% 100%); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .songname { text-align:center; font-family:var(--serif); font-size:1.7rem; }
  .songname small { display:block; font-family:var(--sans); font-size:.85rem; color:var(--muted); }
  /* test */
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt { font:inherit; font-weight:800; font-size:1.25rem; padding:18px 8px; border-radius:16px; border:1px solid #4a3f62; background:#1c1729; color:var(--ink); cursor:pointer; }
  .opt.bad { border-color:var(--rose); color:var(--rose); animation:shake .35s; }
  .opt.good { background:var(--ok); color:#06261a; border-color:var(--ok); }
  @keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
  /* puzle */
  .puzzle { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; background:#000; border-radius:20px; overflow:hidden; aspect-ratio:3/4; }
  .tile { background-size:300% 300%; cursor:pointer; transition:transform .12s; }
  .tile.empty { background:#0b0910 !important; }
  /* memoria */
  .mem { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .mcard { aspect-ratio:3/4; perspective:600px; cursor:pointer; }
  .mcard .in { position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d; }
  .mcard.flip .in { transform:rotateY(180deg); }
  .mcard .f, .mcard .b { position:absolute; inset:0; border-radius:12px; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .mcard .f { background:linear-gradient(135deg,#2c2440,#3d2f57); display:grid; place-items:center; font-family:var(--serif); font-size:1.6rem; color:var(--gold); }
  .mcard .b { transform:rotateY(180deg); background-size:cover; background-position:center; }
  .mcard.done .b { box-shadow:0 0 0 3px var(--ok) inset; }
  /* emoji */
  .emojis { font-size:2.6rem; text-align:center; line-height:1.3; padding:24px 0; background:var(--card); border-radius:20px; letter-spacing:.06em; }
  /* final */
  .lock { display:flex; justify-content:center; gap:10px; }
  .digit { width:64px; height:86px; border-radius:14px; background:#0d0a14; border:1px solid #4a3f62; display:grid; place-items:center; font-size:2.8rem; font-weight:800; font-variant-numeric:tabular-nums; color:var(--gold); overflow:hidden; }
  .letter { font-family:var(--serif); font-size:1.5rem; line-height:1.35; color:var(--ink); }
  .confetti { position:fixed; inset:0; pointer-events:none; z-index:50; }
  /* catálogo */
  .cat { display:flex; flex-direction:column; gap:12px; }
  .cat a { display:flex; gap:14px; align-items:center; padding:14px; border-radius:16px; background:var(--card); color:var(--ink); text-decoration:none; }
  .cat a b { font-size:1.05rem; } .cat a span { color:var(--muted); font-size:.9rem; display:block; margin-top:2px; }
  .cat .n { font-family:var(--serif); font-size:2rem; color:var(--gold); width:44px; flex:none; text-align:center; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  td, th { text-align:left; padding:9px 6px; border-bottom:1px solid #2e2642; vertical-align:top; }
  th { color:var(--gold); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; }
  td a { color:var(--gold); }
  h2 { font-family:var(--serif); font-weight:400; font-size:2rem; margin:8px 0 0; }
  @media (prefers-reduced-motion: reduce) { .vinyl, .reveal { animation:none; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<canvas class="confetti" id="confetti"></canvas>
<script src="pistas.js"></script>
<script src="app.js"></script>
</body>
</html>
